name: Add covers

on:
  push:
    branches: [main]
    paths: [books.json]   # runs whenever the list changes
  schedule:
    - cron: "0 6 * * 1"   # and every Monday at 06:00 UTC, for covers that appear later
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find missing covers
        run: python add_covers.py

      - name: Commit updated books.json
        run: |
          git config user.name "book-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books.json
          git diff --cached --quiet || git commit -m "Add covers $(date -u +%F)"
          git push
