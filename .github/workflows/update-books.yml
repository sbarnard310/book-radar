name: Update books

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch books
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: python fetch_books.py

      - name: Commit updated books.json
        run: |
          git config user.name "book-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books.json
          git diff --cached --quiet || git commit -m "Update books $(date -u +%F)"
          git push
